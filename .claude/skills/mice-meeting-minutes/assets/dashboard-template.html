<style>
/* ===================== BASE ===================== */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  font-family: var(--font);
  font-size: 14px;
  color: var(--ink);
  background: var(--paper);
  line-height: 1.6;
  min-height: 100vh;
}
button { font-family: var(--font); cursor: pointer; border: none; background: none; color: inherit; }
input, select { font-family: var(--font); font-size: 13px; color: var(--ink); }
.num { font-variant-numeric: tabular-nums; }
.print-only { display: none; }

/* ===================== HEADER (component-patterns §7 문서 헤더) ===================== */
.header { background: var(--surface); border-bottom: 1px solid var(--border); }
.header-inner {
  max-width: 1280px; margin: 0 auto; padding: 24px 24px 20px;
  display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap;
}
.kicker {
  font-family: var(--font-mono); font-size: 11px; font-weight: 600; letter-spacing: 2px;
  text-transform: uppercase; color: var(--orange-deep);
}
.header-title { font-size: 25px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.3; color: var(--ink); margin-top: 6px; }
.header-rule { width: 48px; height: 4px; border-radius: 2px; background: var(--orange); margin: 12px 0 10px; }
.header-sub { font-size: 14px; color: var(--brown); }
.header-sub .alert { color: var(--negative); font-weight: 700; }
.header-side { display: flex; flex-direction: column; align-items: flex-end; gap: 12px; }
.brand-slot { display: flex; align-items: center; min-height: 20px; }
.logo { height: 20px; width: auto; display: block; }
.logo-dark { display: none; }
:root[data-theme="dark"] .logo-light { display: none; }
:root[data-theme="dark"] .logo-dark { display: block; }
.brand-text { font-size: 13px; font-weight: 700; color: var(--ink); }
.header-controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.seg { display: flex; background: var(--surface-warm); border: 1px solid var(--border); border-radius: var(--r-btn); padding: 2px; }
.seg-btn { padding: 5px 12px; border-radius: 4px; font-size: 12px; font-weight: 500; color: var(--ink-sub); }
.seg-btn.active { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: inset 0 0 0 1px var(--border-strong); }

/* ===================== CONTAINER ===================== */
.container { max-width: 1280px; margin: 0 auto; padding: 24px; }

/* ===================== KPI CARDS (§3 — 강조 카드는 화면당 1장) ===================== */
.kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 24px; }
.kpi-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-card);
  padding: 20px; box-shadow: var(--shadow); position: relative; overflow: hidden;
}
.kpi-card.kpi-hero { border: 1.25px solid var(--orange); }
.kpi-card.kpi-hero::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px;
  background: linear-gradient(135deg, var(--orange) 0%, var(--orange-soft) 100%);
}
.kpi-label { font-size: 13px; font-weight: 600; letter-spacing: 0.04em; color: var(--ink-sub); margin-bottom: 8px; }
.kpi-value { font-size: 31px; font-weight: 700; line-height: 1.2; letter-spacing: -0.01em; color: var(--ink); font-variant-numeric: tabular-nums; }
.kpi-suffix { font-size: 14px; font-weight: 400; color: var(--warm-gray); margin-left: 4px; }
.kpi-detail { font-size: 12px; color: var(--ink-sub); margin-top: 6px; }
.kpi-detail.alert { color: var(--negative); font-weight: 700; }

/* ===================== TABS ===================== */
.tabs {
  display: flex; gap: 4px; background: var(--surface-warm); border: 1px solid var(--border);
  border-radius: 10px; padding: 4px; margin-bottom: 16px; overflow-x: auto;
}
.tab { padding: 8px 16px; border-radius: var(--r-btn); font-size: 13px; font-weight: 500; color: var(--brown); white-space: nowrap; }
.tab.active { background: var(--ink); color: var(--paper); font-weight: 600; }
.tab.disabled { opacity: 0.4; cursor: not-allowed; }

/* ===================== PANEL ===================== */
.panel {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-card);
  padding: 24px; margin-bottom: 16px; box-shadow: var(--shadow);
}
.panel-title { font-size: 16px; font-weight: 700; color: var(--ink); margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
.panel-title::before { content: ''; width: 3px; height: 14px; border-radius: 2px; background: var(--orange); }
.empty-msg { color: var(--ink-sub); font-size: 13px; padding: 8px 0; }

/* ===================== EMPTY STATE ===================== */
.empty-state {
  background: var(--surface); border: 1.5px dashed var(--border-strong); border-radius: var(--r-card);
  padding: 48px 24px; text-align: center; margin-bottom: 24px;
}
.empty-state h2 { font-size: 20px; color: var(--ink); margin-bottom: 8px; }
.empty-state p { color: var(--ink-sub); font-size: 14px; }

/* ===================== AGENDA ===================== */
.agenda-list { list-style: none; }
.agenda-item {
  padding: 10px 14px; background: var(--surface-warm); border-radius: var(--r-btn);
  margin-bottom: 6px; font-size: 14px; display: flex; gap: 10px; color: var(--ink);
}
.agenda-num { color: var(--orange-deep); font-weight: 600; font-family: var(--font-mono); min-width: 24px; }

/* ===================== 상태 카드 (§4 문서·대시보드 좌측 4px 바) ===================== */
.card-bar { padding: 14px 18px; border-radius: var(--r-btn); margin-bottom: 10px; border-left: 4px solid var(--border); }
.card-bar.tint { background: var(--orange-tint); border-left-color: var(--orange-soft); }   /* 결정사항 */
.card-bar.note { background: var(--surface-warm); border-left-color: var(--steel); }        /* 후속 일정 */
.card-bar.warn { background: var(--amber-bg); border-left-color: var(--amber); }            /* 미결 사항 */
.card-bar.neg  { background: var(--negative-bg); border-left-color: var(--negative); }      /* 리스크 */
.card-bar.carry-over { border-left-style: dashed; }
.card-title { font-size: 14px; font-weight: 600; color: var(--ink); margin-bottom: 4px; }
.card-meta { font-size: 12px; color: var(--brown); }

/* ===================== BADGE (§2) ===================== */
.badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; }
.badge-neutral { background: var(--surface); color: var(--brown); box-shadow: inset 0 0 0 1px var(--border-strong); }
.badge-info { background: var(--steel-tint); color: var(--steel); }
.badge-done { background: var(--positive-bg); color: var(--positive); }
.badge-alert { background: var(--negative-bg); color: var(--negative); font-size: 14px; font-weight: 700; }

/* ===================== KANBAN (§9 — 열 헤더에 상태 배지색) ===================== */
.kanban { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.kanban-col { background: var(--surface-warm); border: 1px solid var(--border); border-radius: 10px; padding: 12px; min-height: 200px; }
.kanban-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.kanban-count { font-family: var(--font-mono); font-size: 12px; color: var(--ink-sub); }
.action-card {
  background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--border-strong);
  border-radius: var(--r-btn); padding: 12px; margin-bottom: 8px; font-size: 13px; color: var(--ink);
}
.action-card:hover { border-top-color: var(--border-strong); border-right-color: var(--border-strong); border-bottom-color: var(--border-strong); }
.action-card.priority-p0 { border-left-color: var(--negative); }
.action-card.priority-p1 { border-left-color: var(--orange-soft); }
.action-card.priority-p2 { border-left-color: var(--steel); }
.action-card.priority-p3 { border-left-color: var(--border-strong); }
.action-card.carry-over { background: var(--amber-bg); }
.action-id { font-family: var(--font-mono); font-size: 11px; color: var(--ink-sub); margin-bottom: 4px; }
.action-title { font-weight: 600; line-height: 1.45; margin-bottom: 8px; }
.action-meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--ink-sub); }
.prio { padding: 1px 8px; border-radius: 999px; font-family: var(--font-mono); font-size: 11px; font-weight: 600; }
.priority-p0 .prio { background: var(--negative); color: var(--on-fill); font-weight: 700; }
:root[data-theme="dark"] .priority-p0 .prio { background: var(--negative-bg); color: var(--negative); }
.priority-p1 .prio { background: var(--orange-tint); color: var(--orange-deep); }
.priority-p2 .prio { background: var(--steel-tint); color: var(--steel); }
.priority-p3 .prio { background: var(--surface-warm); color: var(--brown); }
.status-select {
  background: var(--surface); border: 1px solid var(--border); border-radius: 4px; padding: 2px 4px;
  font-size: 11px; font-family: var(--font-mono); color: var(--ink); cursor: pointer;
}
.due { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.due-soon { color: var(--orange-deep); font-weight: 600; }
.due-overdue { color: var(--negative); font-weight: 700; }

/* ===================== FILTERS ===================== */
.filter-bar { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
.chip { padding: 6px 12px; border-radius: 999px; font-size: 12px; background: var(--surface); border: 1px solid var(--border); color: var(--brown); }
.chip.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.search-input {
  padding: 7px 14px; border: 1px solid var(--border); border-radius: 999px; font-size: 13px;
  flex: 1; min-width: 180px; background: var(--surface); color: var(--ink);
}
.select-field { padding: 7px 10px; border: 1px solid var(--border); border-radius: var(--r-btn); background: var(--surface); color: var(--ink); width: 160px; }
.search-input:focus, .select-field:focus, button:focus-visible { outline: 2px solid var(--orange); outline-offset: 1px; }

/* ===================== CHARTS (§6 — 시리즈 S1~S5, 3D·그림자 금지) ===================== */
.chart-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 12px; margin-bottom: 16px; }
.chart-container {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-card);
  padding: 16px; margin-bottom: 16px; box-shadow: var(--shadow);
}
.chart-grid .chart-container { margin-bottom: 0; }
.chart-title { font-size: 14px; font-weight: 600; color: var(--ink); margin-bottom: 12px; }
.recharts-legend-item-text { color: var(--ink) !important; }

/* ===================== TABLE (§5 — 가로선만) ===================== */
.table { width: 100%; border-collapse: collapse; font-size: 13px; }
.table th {
  text-align: left; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; color: var(--ink-sub);
  padding: 8px; border-bottom: 1.5px solid var(--ink);
}
.table td { padding: 8px; border-bottom: 1px solid var(--line-soft); color: var(--brown); }
.table td:first-child { color: var(--ink); font-weight: 600; }
.table .num { text-align: right; }
.table td.alert { color: var(--negative); font-weight: 700; }

/* ===================== STRATEGY ===================== */
.strategy-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
.strategy-card { background: var(--surface-warm); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
.strategy-q { font-family: var(--font-mono); font-size: 11px; font-weight: 700; letter-spacing: 0.18em; color: var(--orange-deep); margin-bottom: 4px; }
.strategy-hint { font-size: 12px; color: var(--ink-sub); margin-bottom: 8px; }
.strategy-content { font-size: 14px; line-height: 1.65; color: var(--ink); }

/* ===================== DISCUSSION ===================== */
.discussion-block { margin-bottom: 16px; }
.discussion-agenda { font-size: 13px; font-weight: 700; color: var(--orange-deep); margin-bottom: 6px; }
.discussion-utt { display: flex; gap: 12px; padding: 8px 0; font-size: 13px; border-bottom: 1px solid var(--line-soft); }
.discussion-utt:last-child { border-bottom: none; }
.discussion-speaker { font-weight: 600; color: var(--ink); min-width: 160px; }
.discussion-text { flex: 1; color: var(--brown); }

/* ===================== BUTTONS (§1) ===================== */
.btn-primary { background: var(--btn-primary); color: var(--on-fill); padding: 9px 18px; border-radius: var(--r-btn); font-size: 13px; font-weight: 600; }
.btn-primary:hover { opacity: 0.85; }
.btn-secondary {
  background: var(--surface); color: var(--brown); padding: 8px 16px; border: 1.5px solid var(--brown);
  border-radius: var(--r-btn); font-size: 13px; font-weight: 600;
}
.btn-secondary:hover { background: var(--brown); color: var(--surface); }

/* ===================== TOOLBAR FOOTER ===================== */
.toolbar {
  position: sticky; bottom: 0; z-index: 50; background: var(--surface); border-top: 1px solid var(--border);
  padding: 12px 24px; display: flex; gap: 8px; justify-content: space-between; align-items: center; flex-wrap: wrap;
}
.toolbar-info { font-size: 12px; color: var(--ink-sub); }
.toolbar-info strong { color: var(--ink); font-weight: 600; }
.toolbar-actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* ===================== TOAST (fade 240ms, 바운스 없음) ===================== */
.toast {
  position: fixed; bottom: 80px; right: 24px; z-index: 200; padding: 12px 18px; border-radius: 8px;
  font-size: 14px; background: var(--ink); color: var(--paper); animation: fadeIn 0.24s;
}
.toast-success { background: var(--positive-bg); color: var(--positive); font-weight: 600; box-shadow: inset 0 0 0 1px var(--positive); }
.toast-error { background: var(--negative-bg); color: var(--negative); font-weight: 700; box-shadow: inset 0 0 0 1px var(--negative); }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

/* ===================== PRINT (RULE-PRINT-LIGHT — 토큰은 @design-tokens 블록에서 라이트 강제) ===================== */
@media print {
  .toolbar, .tabs, .filter-bar, .header-controls, .empty-state { display: none !important; }
  .print-only { display: block; }
  .logo-light { display: block !important; }
  .logo-dark { display: none !important; }
  .header { border-bottom: none; }
  .header-inner, .container { padding: 0 0 12px; max-width: 100%; }
  .panel, .chart-container, .kpi-card { box-shadow: none; break-inside: avoid; }
  .kanban { grid-template-columns: repeat(2, 1fr); }
  .print-footer { margin-top: 16px; padding-top: 8px; border-top: 1px solid var(--border); font-size: 12px; color: var(--ink-sub); }
}

/* ===================== RESPONSIVE ===================== */
@media (max-width: 900px) {
  .kanban, .kpi-grid { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 600px) {
  .kanban { grid-template-columns: 1fr; }
  .header-side { align-items: flex-start; }
  .header-title { font-size: 20px; }
  .discussion-utt { flex-direction: column; gap: 2px; }
}
</style>

<script type="text/babel" data-presets="env,react">
const { useState, useEffect, useMemo, useCallback } = React;
const {
  LineChart, Line, BarChart, Bar, PieChart, Pie, Cell,
  XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, Legend
} = Recharts;

/* =========================================================
   빌드 시 주입 (build_dashboard.py)
   - INITIAL_DATA : 8축 회의록 데이터
   - BRAND        : 발행 명의·발주처 슬롯·로고 2종(data URI)·첫 테마·스킬 버전
   ========================================================= */
const INITIAL_DATA = {{INITIAL_DATA}};
const BRAND = {{BRAND}};

/* =========================================================
   색은 CSS 변수(@design-tokens 블록)에서만 읽는다 — usage-guide §3.5.
   테마 전환 시 다시 읽어 차트를 재색칠한다.
   ========================================================= */
const cssVar = (k) => getComputedStyle(document.documentElement).getPropertyValue(k).trim();
function readPalette() {
  return {
    s1: cssVar('--s1'), s2: cssVar('--s2'), s3: cssVar('--s3'), s4: cssVar('--s4'), s5: cssVar('--s5'),
    positive: cssVar('--positive'), negative: cssVar('--negative'),
    grid: cssVar('--grid'), axis: cssVar('--ink-sub'), ink: cssVar('--ink'),
    surface: cssVar('--surface'), border: cssVar('--border'),
  };
}

/* =========================================================
   테마 (라이트 기본 · 다크 토글) — mode-mapping §4.1
   - 첫 렌더는 라이트(BRAND.theme). 사용자가 토글하면 localStorage 'mm-theme'에 저장
   - 인쇄 라이트 강제는 CSS @media print (RULE-PRINT-LIGHT)
   ========================================================= */
const THEME_KEY = 'mm-theme';
function getInitialTheme() {
  try {
    const saved = localStorage.getItem(THEME_KEY);
    if (saved === 'dark' || saved === 'light') return saved;
  } catch (e) { /* localStorage 차단 환경 */ }
  return BRAND.theme === 'dark' ? 'dark' : 'light';
}
function applyThemeToRoot(theme) {
  document.documentElement.setAttribute('data-theme', theme);
}
function saveTheme(theme) {
  try { localStorage.setItem(THEME_KEY, theme); } catch (e) { /* */ }
}
applyThemeToRoot(getInitialTheme());

/* =========================================================
   Storage Adapter (window.storage 우선, localStorage 폴백)
   ========================================================= */
const Storage = {
  async get(key) {
    if (typeof window.storage !== 'undefined') {
      try { const r = await window.storage.get(key); return r ? JSON.parse(r.value) : null; }
      catch (e) { return null; }
    }
    try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : null; }
    catch (e) { return null; }
  },
  async set(key, value) {
    const json = JSON.stringify(value);
    if (typeof window.storage !== 'undefined') {
      try { await window.storage.set(key, json); return true; } catch (e) { return false; }
    }
    try { localStorage.setItem(key, json); return true; } catch (e) { return false; }
  },
};

/* =========================================================
   유틸
   ========================================================= */
function dueStatus(due, status) {
  if (!due || status === 'DONE') return 'normal';
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const d = new Date(due);
  if (isNaN(d)) return 'normal';
  const diff = Math.ceil((d - today) / 86400000);
  if (diff < 0) return 'overdue';
  if (diff <= 3) return 'soon';
  return 'normal';
}

function showToast(msg, type = '') {
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  t.setAttribute('role', 'status');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2500);
}

async function copyToClipboard(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      return true;
    }
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  } catch (e) { return false; }
}

function downloadJSON(data, filename) {
  const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}

function formatDateForFilename(d = new Date()) {
  return `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
}

function sanitizeFilename(name) {
  return String(name || 'meeting').replace(/[^a-zA-Z0-9가-힣._-]/g, '-').slice(0, 60);
}

function buildSlackMd(data) {
  const lines = [];
  lines.push(`**[${data.project_name}] 미팅 요약 (${data.meeting_date})**`);
  if (data.series_id) lines.push(`_시리즈 ${data.series_id} / ${data.series_session_no || 1}차_`);
  lines.push('');
  if (data.attendees?.length) { lines.push(`**참석:** ${data.attendees.join(', ')}`); lines.push(''); }
  if (data.decisions?.length) {
    lines.push('**결정사항**');
    data.decisions.slice(0, 3).forEach(d => lines.push(`- ${d.text}`));
    if (data.decisions.length > 3) lines.push(`- (외 ${data.decisions.length - 3}건은 회의록 참조)`);
    lines.push('');
  }
  if (data.actions?.length) {
    lines.push('**Action**');
    data.actions.slice(0, 3).forEach(a => lines.push(`- (${a.owner}) ${a.action} — ${a.due}`));
    if (data.actions.length > 3) lines.push(`- (외 Action ${data.actions.length - 3}건은 회의록 참조)`);
    lines.push('');
  }
  if (data.next_steps?.length) {
    const ns = data.next_steps[0];
    lines.push(`**다음:** ${ns.title}${ns.date_str ? ' (' + ns.date_str + ')' : ''}`);
    lines.push('');
  }
  const p = (data.pending || []).length, r = (data.risks || []).length;
  if (p || r) { lines.push(`_(미결 ${p}건 / 리스크 ${r}건 — 회의록 본문 참조)_`); lines.push(''); }
  if (data.mode === 'internal' && data.strategy_oneliner) lines.push(`**전략 코멘트:** ${data.strategy_oneliner}`);
  lines.push('---');
  lines.push(data.mode === 'external' ? '_본 요약은 양측 공유용입니다._' : '_[Internal] 외부 공유 금지_');
  return lines.join('\n');
}

/* =========================================================
   메인 앱
   ========================================================= */
function App() {
  const [data, setData] = useState(INITIAL_DATA);
  const [activeTab, setActiveTab] = useState('current');
  const [mode, setMode] = useState(INITIAL_DATA.mode || 'internal');
  const [theme, setThemeState] = useState(getInitialTheme);
  const [palette, setPalette] = useState(readPalette);
  const [filter, setFilter] = useState({owner: 'all', priority: 'all', search: ''});
  const [seriesHistory, setSeriesHistory] = useState([]);

  const setTheme = (t) => { saveTheme(t); setThemeState(t); };

  useEffect(() => {
    applyThemeToRoot(theme);
    setPalette(readPalette());
  }, [theme]);

  useEffect(() => {
    if (data.series_id) {
      Storage.get(`mice-mtg:${data.series_id}`).then(saved => {
        if (saved && Array.isArray(saved)) setSeriesHistory(saved);
      });
    }
  }, [data.series_id]);

  useEffect(() => { setData(prev => ({...prev, mode})); }, [mode]);

  /* KPI */
  const kpis = useMemo(() => {
    const actions = data.actions || [];
    const total = actions.length;
    const done = actions.filter(a => a.status === 'DONE').length;
    return {
      decisions: (data.decisions || []).length,
      actions: total,
      done,
      pending: (data.pending || []).length,
      completion: total ? Math.round(done / total * 100) : 0,
      blocked: actions.filter(a => a.status === 'BLOCKED').length,
      overdue: actions.filter(a => dueStatus(a.due, a.status) === 'overdue').length,
    };
  }, [data]);

  const updateActionStatus = useCallback((id, newStatus) => {
    setData(prev => ({...prev, actions: prev.actions.map(a => a.id === id ? {...a, status: newStatus} : a)}));
  }, []);

  const filteredActions = useMemo(() => {
    let list = data.actions || [];
    if (filter.owner !== 'all') list = list.filter(a => a.owner === filter.owner);
    if (filter.priority !== 'all') list = list.filter(a => a.priority === filter.priority);
    if (filter.search) {
      const s = filter.search.toLowerCase();
      list = list.filter(a => [a.action, a.owner, a.id].some(v => (v || '').toLowerCase().includes(s)));
    }
    return list;
  }, [data.actions, filter]);

  const ownerList = useMemo(() => Array.from(new Set((data.actions || []).map(a => a.owner))), [data.actions]);

  const seriesChartData = useMemo(() => seriesHistory.map(s => ({
    session: `${s.session_no}차`,
    완료율: s.completion_rate ? Math.round(s.completion_rate * 100) : 0,
    신규: s.new_actions || 0,
    Carryover: s.carry_over_actions || 0,
  })), [seriesHistory]);

  /* 상태 도넛 — 칸반 배지와 같은 의미색 (중립 S4 · 진행 S2 · 차단 negative · 완료 positive) */
  const statusDonutData = useMemo(() => {
    const c = {TODO: 0, DOING: 0, BLOCKED: 0, DONE: 0};
    (data.actions || []).forEach(a => { c[a.status] = (c[a.status] || 0) + 1; });
    return [
      {name: 'TODO', value: c.TODO, color: palette.s4},
      {name: 'DOING', value: c.DOING, color: palette.s2},
      {name: 'BLOCKED', value: c.BLOCKED, color: palette.negative},
      {name: 'DONE', value: c.DONE, color: palette.positive},
    ].filter(d => d.value > 0);
  }, [data.actions, palette]);

  const ownerBarData = useMemo(() => {
    const m = {};
    (data.actions || []).forEach(a => {
      if (!m[a.owner]) m[a.owner] = {owner: a.owner, total: 0, done: 0};
      m[a.owner].total += 1;
      if (a.status === 'DONE') m[a.owner].done += 1;
    });
    return Object.values(m);
  }, [data.actions]);

  const handleSlackCopy = async () => {
    const ok = await copyToClipboard(buildSlackMd(data));
    showToast(ok ? 'Slack 페이스트용 요약을 복사했습니다' : '복사에 실패했습니다', ok ? 'toast-success' : 'toast-error');
  };

  const handlePdfExport = () => {
    showToast('인쇄 대화상자에서 "PDF로 저장"을 선택하세요');
    setTimeout(() => window.print(), 300);
  };

  const handleJsonBackup = () => {
    const today = formatDateForFilename();
    const filename = data.series_id
      ? `mm-series-backup-${sanitizeFilename(data.series_id)}-${today}.json`
      : `mm-backup-${sanitizeFilename(data.project_name)}-${today}.json`;
    downloadJSON({
      _meta: {
        backup_date: new Date().toISOString(),
        skill_version: BRAND.skillVersion,
        project_name: data.project_name,
        series_id: data.series_id || null,
        theme, mode,
      },
      current_session: {
        meeting_date: data.meeting_date, type_label: data.type_label, attendees: data.attendees,
        agenda: data.agenda, decisions: data.decisions, actions: data.actions, risks: data.risks,
        pending: data.pending, next_steps: data.next_steps, discussion: data.discussion,
        strategy_note: data.strategy_note, strategy_oneliner: data.strategy_oneliner,
      },
      series_history: seriesHistory,
    }, filename);
    showToast('JSON 백업 다운로드 — ' + filename, 'toast-success');
  };

  const handleSaveSession = async () => {
    if (!data.series_id) { showToast('시리즈 ID가 없습니다', 'toast-error'); return; }
    const acts = data.actions || [];
    const session = {
      session_no: data.series_session_no || (seriesHistory.length + 1),
      date: data.meeting_date,
      new_actions: acts.filter(a => !a.is_carry_over).length,
      carry_over_actions: acts.filter(a => a.is_carry_over).length,
      done: acts.filter(a => a.status === 'DONE').length,
      doing: acts.filter(a => a.status === 'DOING').length,
      blocked: acts.filter(a => a.status === 'BLOCKED').length,
      todo: acts.filter(a => a.status === 'TODO').length,
      completion_rate: kpis.completion / 100,
      data_snapshot: data,
    };
    const updated = [...seriesHistory.filter(s => s.session_no !== session.session_no), session]
      .sort((a, b) => a.session_no - b.session_no);
    const ok = await Storage.set(`mice-mtg:${data.series_id}`, updated);
    if (ok) { setSeriesHistory(updated); showToast('시리즈 저장 완료', 'toast-success'); }
    else showToast('저장에 실패했습니다', 'toast-error');
  };

  const isEmpty = !data.project_name || !data.meeting_date;

  return (
    <div>
      <Header data={data} mode={mode} setMode={setMode} theme={theme} setTheme={setTheme} kpis={kpis} />
      <div className="container">
        {isEmpty && <EmptyState />}
        {!isEmpty && (
          <>
            <KpiCards kpis={kpis} />
            <Tabs activeTab={activeTab} setActiveTab={setActiveTab}
                  hasSeries={!!data.series_id} showStrategy={mode === 'internal'} />
            {activeTab === 'current' && <CurrentMeetingTab data={data} />}
            {activeTab === 'actions' && (
              <ActionTab actions={filteredActions} allActions={data.actions || []} filter={filter}
                         setFilter={setFilter} ownerList={ownerList} onUpdateStatus={updateActionStatus}
                         statusDonutData={statusDonutData} ownerBarData={ownerBarData} palette={palette} />
            )}
            {activeTab === 'series' && data.series_id && (
              <SeriesTab seriesId={data.series_id} history={seriesHistory} chartData={seriesChartData}
                         onSave={handleSaveSession} palette={palette} />
            )}
            {activeTab === 'strategy' && mode === 'internal' && <StrategyTab note={data.strategy_note} />}
            <div className="print-only print-footer">
              발행 {BRAND.publisher} · {data.meeting_date} · {mode === 'external' ? '송부용' : '내부 보관용 — 외부 공유 금지'}
            </div>
          </>
        )}
      </div>
      <Toolbar mode={mode} onSlack={handleSlackCopy} onPdf={handlePdfExport} onJson={handleJsonBackup}
               onSaveSession={handleSaveSession} hasSeries={!!data.series_id} isEmpty={isEmpty} />
    </div>
  );
}

/* ============ Header — 킥커 · 제목 · 오렌지 룰 · 리드 + 리멤버 로고 슬롯 ============ */
function BrandSlot() {
  if (BRAND.logoLight || BRAND.logoDark) {
    return (
      <div className="brand-slot" aria-label={BRAND.publisher}>
        {BRAND.logoLight && <img className="logo logo-light" src={BRAND.logoLight} alt={BRAND.publisher} />}
        {BRAND.logoDark && <img className="logo logo-dark" src={BRAND.logoDark} alt={BRAND.publisher} />}
      </div>
    );
  }
  return <div className="brand-slot"><span className="brand-text">{BRAND.publisher}</span></div>;
}

function Header({data, mode, setMode, theme, setTheme, kpis}) {
  const kicker = ['Meeting Minutes', data.meeting_type ? `Type ${data.meeting_type}` : '',
                  data.series_id ? `${data.series_id} · ${data.series_session_no || 1}차` : '']
                  .filter(Boolean).join(' · ');
  const sub = [
    [data.meeting_date, data.meeting_time].filter(Boolean).join(' '),
    data.location, data.type_label,
    BRAND.clientCompany ? `발주처 ${BRAND.clientCompany}` : '',
  ].filter(Boolean).join(' · ');
  return (
    <header className="header">
      <div className="header-inner">
        <div>
          <div className="kicker">{kicker}</div>
          <h1 className="header-title">{data.project_name || '회의록 대시보드'}</h1>
          <div className="header-rule"></div>
          <div className="header-sub">
            {sub}
            {kpis.overdue > 0 && <span className="alert"> · 지연 Action {kpis.overdue}건</span>}
          </div>
        </div>
        <div className="header-side">
          <BrandSlot />
          <div className="header-controls">
            <div className="seg" role="group" aria-label="콘텐츠 모드">
              <button className={`seg-btn ${mode === 'internal' ? 'active' : ''}`} aria-pressed={mode === 'internal'}
                      onClick={() => setMode('internal')}>Internal</button>
              <button className={`seg-btn ${mode === 'external' ? 'active' : ''}`} aria-pressed={mode === 'external'}
                      onClick={() => setMode('external')}>External</button>
            </div>
            <div className="seg" role="group" aria-label="테마">
              <button className={`seg-btn ${theme === 'light' ? 'active' : ''}`} aria-pressed={theme === 'light'}
                      onClick={() => setTheme('light')}>라이트</button>
              <button className={`seg-btn ${theme === 'dark' ? 'active' : ''}`} aria-pressed={theme === 'dark'}
                      onClick={() => setTheme('dark')}>다크</button>
            </div>
          </div>
        </div>
      </div>
    </header>
  );
}

function EmptyState() {
  return (
    <div className="empty-state">
      <h2>미팅 데이터가 없습니다</h2>
      <p>미팅 transcript·메모를 입력해 대시보드를 다시 빌드하세요.<br/>
      클로바노트·Otter·Whisper·Zoom·Meet·Teams export를 지원합니다.</p>
    </div>
  );
}

/* ============ KPI — 강조(hero) 카드는 완료율 1장 ============ */
function KpiCards({kpis}) {
  return (
    <div className="kpi-grid">
      <KpiCard label="결정사항" value={kpis.decisions} suffix="건" />
      <KpiCard label="Action" value={kpis.actions} suffix="건" detail={`완료 ${kpis.done}건`} />
      <KpiCard label="미결 사항" value={kpis.pending} suffix="건"
               detail={kpis.blocked > 0 ? `Action 차단 ${kpis.blocked}건` : ''} alert={kpis.blocked > 0} />
      <KpiCard label="Action 완료율" value={kpis.completion} suffix="%" hero
               detail={kpis.overdue > 0 ? `지연 ${kpis.overdue}건` : '지연 없음'} alert={kpis.overdue > 0} />
    </div>
  );
}

function KpiCard({label, value, suffix, detail, hero = false, alert = false}) {
  return (
    <div className={`kpi-card ${hero ? 'kpi-hero' : ''}`}>
      <div className="kpi-label">{label}</div>
      <div className="kpi-value">{value}{suffix && <span className="kpi-suffix">{suffix}</span>}</div>
      {detail && <div className={`kpi-detail ${alert ? 'alert' : ''}`}>{detail}</div>}
    </div>
  );
}

function Tabs({activeTab, setActiveTab, hasSeries, showStrategy}) {
  const tabs = [
    {id: 'current', label: '본 미팅'},
    {id: 'actions', label: 'Action 트래커'},
    {id: 'series', label: '시리즈 누적', disabled: !hasSeries},
    {id: 'strategy', label: '전략 메모', disabled: !showStrategy},
  ];
  return (
    <div className="tabs" role="tablist">
      {tabs.map(t => (
        <button key={t.id} role="tab" aria-selected={activeTab === t.id}
                className={`tab ${activeTab === t.id ? 'active' : ''} ${t.disabled ? 'disabled' : ''}`}
                onClick={() => !t.disabled && setActiveTab(t.id)}>{t.label}</button>
      ))}
    </div>
  );
}

function EmptyMsg({text}) {
  return <div className="empty-msg">({text})</div>;
}

/* ============ 본 미팅 탭 ============ */
function CurrentMeetingTab({data}) {
  return (
    <div>
      <div className="panel">
        <div className="panel-title">안건</div>
        {data.agenda?.length ? (
          <ul className="agenda-list">
            {data.agenda.map((item, i) => (
              <li key={i} className="agenda-item"><span className="agenda-num">{String(i + 1).padStart(2, '0')}</span><span>{item}</span></li>
            ))}
          </ul>
        ) : <EmptyMsg text="안건 미식별" />}
      </div>

      <div className="panel">
        <div className="panel-title">결정사항</div>
        {data.decisions?.length ? data.decisions.map((d, i) => (
          <div key={i} className="card-bar tint">
            <div className="card-title">[결정 {i + 1}] {d.text}</div>
            {(d.timestamp || d.rationale) && (
              <div className="card-meta">
                {d.timestamp && `합의 시점 ${d.timestamp}`}{d.timestamp && d.rationale && ' · '}{d.rationale && `근거 ${d.rationale}`}
              </div>
            )}
          </div>
        )) : <EmptyMsg text="결정사항 미식별 — 회의 내용 재확인 필요" />}
      </div>

      {data.discussion && Object.keys(data.discussion).length > 0 && (
        <div className="panel">
          <div className="panel-title">발언 요지</div>
          {Object.entries(data.discussion).map(([idx, statements]) => (
            <div key={idx} className="discussion-block">
              <div className="discussion-agenda">{data.agenda?.[parseInt(idx)] || `안건 ${idx}`}</div>
              {statements.map((s, i) => (
                <div key={i} className="discussion-utt">
                  <div className="discussion-speaker">{s[0] || s.speaker}</div>
                  <div className="discussion-text">{s[1] || s.text}</div>
                </div>
              ))}
            </div>
          ))}
        </div>
      )}

      <div className="panel">
        <div className="panel-title">리스크·이슈</div>
        {data.risks?.length ? data.risks.map((r, i) => (
          <div key={i} className="card-bar neg">
            <div className="card-title">[리스크 {i + 1}] {r.text}</div>
            <div className="card-meta">
              영향도 {r.impact}{r.timestamp && ` · 식별 시점 ${r.timestamp}`}{r.response && ` · 대응안 ${r.response}`}
            </div>
          </div>
        )) : <EmptyMsg text="식별된 리스크 없음" />}
      </div>

      <div className="panel">
        <div className="panel-title">미결 사항</div>
        {data.pending?.length ? data.pending.map((p, i) => (
          <div key={i} className={`card-bar warn ${p.is_carry_over ? 'carry-over' : ''}`}>
            <div className="card-title">{p.is_carry_over && '↻ '}[미결 {i + 1}] {p.text}</div>
            <div className="card-meta">
              보류 사유 {p.reason}{p.next_review && ` · 재논의 ${p.next_review}`}{p.owner && ` · 책임 ${p.owner}`}
            </div>
          </div>
        )) : <EmptyMsg text="미결 사항 없음" />}
      </div>

      <div className="panel">
        <div className="panel-title">후속 일정</div>
        {data.next_steps?.length ? data.next_steps.map((n, i) => (
          <div key={i} className="card-bar note">
            <div className="card-title">[다음 단계 {i + 1}] {n.title}</div>
            <div className="card-meta">
              {n.date_str && `일자 ${n.date_str}`}{n.attendees && ` · 참석 ${n.attendees}`}{n.agenda && ` · 안건 ${n.agenda}`}
            </div>
          </div>
        )) : <EmptyMsg text="후속 일정 미정" />}
      </div>
    </div>
  );
}

/* ============ Action 트래커 탭 ============ */
const STATUS_COLS = [
  {id: 'TODO', label: 'TODO', badge: 'badge-neutral'},
  {id: 'DOING', label: 'DOING', badge: 'badge-info'},
  {id: 'BLOCKED', label: 'BLOCKED', badge: 'badge-alert'},
  {id: 'DONE', label: 'DONE', badge: 'badge-done'},
];

function chartChrome(palette) {
  return {
    grid: palette.grid,
    tick: {fontSize: 11, fill: palette.axis},
    tooltip: {backgroundColor: palette.surface, border: `1px solid ${palette.border}`, color: palette.ink},
  };
}

function ActionTab({actions, allActions, filter, setFilter, ownerList, onUpdateStatus, statusDonutData, ownerBarData, palette}) {
  const ch = chartChrome(palette);
  const pieLabel = (p) => (
    <text x={p.x} y={p.y} fill={palette.ink} fontSize={12} textAnchor={p.textAnchor} dominantBaseline="central">
      {`${p.name} ${p.value}`}
    </text>
  );
  return (
    <div>
      {allActions.length > 0 && (
        <div className="chart-grid">
          <div className="chart-container">
            <div className="chart-title">Status 분포</div>
            <ResponsiveContainer width="100%" height={220}>
              <PieChart>
                <Pie data={statusDonutData} cx="50%" cy="50%" innerRadius={50} outerRadius={80}
                     dataKey="value" label={pieLabel} isAnimationActive={false}>
                  {statusDonutData.map((e, i) => <Cell key={i} fill={e.color} stroke={palette.surface} />)}
                </Pie>
                <Tooltip contentStyle={ch.tooltip} />
              </PieChart>
            </ResponsiveContainer>
          </div>
          <div className="chart-container">
            <div className="chart-title">Owner별 Action</div>
            <ResponsiveContainer width="100%" height={220}>
              <BarChart data={ownerBarData}>
                <CartesianGrid strokeDasharray="3 3" stroke={ch.grid} />
                <XAxis dataKey="owner" tick={ch.tick} stroke={palette.axis} />
                <YAxis allowDecimals={false} tick={ch.tick} stroke={palette.axis} />
                <Tooltip contentStyle={ch.tooltip} cursor={{fill: palette.grid}} />
                <Legend />
                <Bar dataKey="total" fill={palette.s4} name="전체" />
                <Bar dataKey="done" fill={palette.positive} name="완료" />
              </BarChart>
            </ResponsiveContainer>
          </div>
        </div>
      )}

      <div className="filter-bar">
        <input className="search-input" placeholder="Action 검색" value={filter.search}
               onChange={e => setFilter({...filter, search: e.target.value})} />
        <button className={`chip ${filter.priority === 'all' ? 'active' : ''}`}
                onClick={() => setFilter({...filter, priority: 'all'})}>전체 우선순위</button>
        {['P0', 'P1', 'P2', 'P3'].map(p => (
          <button key={p} className={`chip ${filter.priority === p ? 'active' : ''}`}
                  onClick={() => setFilter({...filter, priority: p})}>{p}</button>
        ))}
        <select className="select-field" value={filter.owner} onChange={e => setFilter({...filter, owner: e.target.value})}>
          <option value="all">전체 Owner</option>
          {ownerList.map(o => <option key={o} value={o}>{o}</option>)}
        </select>
      </div>

      <div className="kanban">
        {STATUS_COLS.map(col => {
          const colActions = actions.filter(a => a.status === col.id);
          return (
            <div key={col.id} className="kanban-col">
              <div className="kanban-header">
                <span className={`badge ${col.badge}`}>{col.label}</span>
                <span className="kanban-count">{colActions.length}</span>
              </div>
              {colActions.map(a => <ActionCard key={a.id} action={a} onUpdateStatus={onUpdateStatus} />)}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function ActionCard({action, onUpdateStatus}) {
  const ds = dueStatus(action.due, action.status);
  return (
    <div className={`action-card priority-${(action.priority || '').toLowerCase()} ${action.is_carry_over ? 'carry-over' : ''}`}>
      <div className="action-id">{action.is_carry_over && '↻ '}{action.id}</div>
      <div className="action-title">{action.action}</div>
      <div className="action-meta">
        <span className="prio">{action.priority}</span>
        <span>{action.owner}</span>
        <span className={`due ${ds === 'overdue' ? 'due-overdue' : ds === 'soon' ? 'due-soon' : ''}`}>
          {action.due}{ds === 'overdue' ? ' 지연' : ''}
        </span>
        <select className="status-select" value={action.status} aria-label="상태 변경"
                onChange={e => onUpdateStatus(action.id, e.target.value)}>
          {STATUS_COLS.map(c => <option key={c.id} value={c.id}>{c.label}</option>)}
        </select>
      </div>
    </div>
  );
}

/* ============ 시리즈 누적 탭 — 완료율 S1 · 신규 S2 · carry-over S5 ============ */
function SeriesTab({seriesId, history, chartData, onSave, palette}) {
  const ch = chartChrome(palette);
  return (
    <div>
      <div className="panel">
        <div className="panel-title">시리즈 — {seriesId}</div>
        <div style={{display: 'flex', gap: 12, alignItems: 'center', justifyContent: 'space-between', flexWrap: 'wrap'}}>
          <div className="card-meta">누적 {history.length}회 · 본 회차를 저장하면 회차별 추이가 쌓입니다</div>
          <button className="btn-primary" onClick={onSave}>본 회차 시리즈 저장</button>
        </div>
      </div>

      {history.length === 0 && <EmptyMsg text="누적된 시리즈 데이터가 없습니다. 본 회차를 저장해 시작하세요" />}

      {history.length > 0 && (
        <>
          <div className="chart-container">
            <div className="chart-title">회차별 완료율</div>
            <ResponsiveContainer width="100%" height={240}>
              <LineChart data={chartData}>
                <CartesianGrid strokeDasharray="3 3" stroke={ch.grid} />
                <XAxis dataKey="session" tick={ch.tick} stroke={palette.axis} />
                <YAxis domain={[0, 100]} tick={ch.tick} stroke={palette.axis} unit="%" />
                <Tooltip contentStyle={ch.tooltip} />
                <Legend />
                <Line type="monotone" dataKey="완료율" stroke={palette.s1} strokeWidth={3} dot={{r: 3, fill: palette.s1}} />
              </LineChart>
            </ResponsiveContainer>
          </div>

          <div className="chart-container">
            <div className="chart-title">회차별 Action 구성</div>
            <ResponsiveContainer width="100%" height={240}>
              <BarChart data={chartData}>
                <CartesianGrid strokeDasharray="3 3" stroke={ch.grid} />
                <XAxis dataKey="session" tick={ch.tick} stroke={palette.axis} />
                <YAxis allowDecimals={false} tick={ch.tick} stroke={palette.axis} />
                <Tooltip contentStyle={ch.tooltip} cursor={{fill: palette.grid}} />
                <Legend />
                <Bar dataKey="신규" stackId="a" fill={palette.s2} />
                <Bar dataKey="Carryover" stackId="a" fill={palette.s5} name="Carry-over" />
              </BarChart>
            </ResponsiveContainer>
          </div>

          <div className="panel">
            <div className="panel-title">회차 누적 통계</div>
            <table className="table">
              <thead>
                <tr>
                  <th>회차</th><th>일자</th><th className="num">신규</th><th className="num">Carry-over</th>
                  <th className="num">DONE</th><th className="num">BLOCKED</th><th className="num">완료율</th>
                </tr>
              </thead>
              <tbody>
                {history.map((s, i) => (
                  <tr key={i}>
                    <td>{s.session_no}차</td>
                    <td>{s.date}</td>
                    <td className="num">{s.new_actions}</td>
                    <td className="num">{s.carry_over_actions}</td>
                    <td className="num">{s.done}</td>
                    <td className={`num ${s.blocked > 0 ? 'alert' : ''}`}>{s.blocked}</td>
                    <td className="num" style={{fontWeight: 700, color: 'var(--ink)'}}>{Math.round((s.completion_rate || 0) * 100)}%</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </>
      )}
    </div>
  );
}

/* ============ 전략 메모 탭 (Internal 한정) ============ */
function StrategyTab({note}) {
  if (!note) {
    return (
      <div className="panel">
        <div className="panel-title">전략 메모</div>
        <EmptyMsg text="전략 메모 없음 (Internal 모드 한정)" />
      </div>
    );
  }
  const cards = [
    {q: 'WHO', hint: '누가 영향을 받는가', content: note.who},
    {q: 'WHAT', hint: '진짜 안건은 무엇이었나', content: note.what},
    {q: 'WHEN', hint: '타이밍은 적절했나', content: note.when_ || note.when},
    {q: 'WHERE', hint: '결과가 어디까지 확산되나', content: note.where},
    {q: 'WHY', hint: '왜 이 결정이 나왔나', content: note.why},
    {q: 'HOW', hint: '어떻게 활용할 것인가', content: note.how},
  ].filter(c => c.content);
  return (
    <div className="panel">
      <div className="panel-title">전략 메모 — Internal 한정, 외부 송부 금지</div>
      <div className="strategy-grid">
        {cards.map((c, i) => (
          <div key={i} className="strategy-card">
            <div className="strategy-q">{c.q}</div>
            <div className="strategy-hint">{c.hint}</div>
            <div className="strategy-content">{c.content}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ============ 하단 툴바 ============ */
function Toolbar({mode, onSlack, onPdf, onJson, onSaveSession, hasSeries, isEmpty}) {
  if (isEmpty) return null;
  return (
    <div className="toolbar">
      <div className="toolbar-info">
        <strong>{BRAND.publisher}</strong> · {mode === 'internal' ? '[Internal] 외부 공유 금지' : '[External] 송부용'}
      </div>
      <div className="toolbar-actions">
        <button className="btn-primary" onClick={onSlack}>Slack 페이스트</button>
        <button className="btn-secondary" onClick={onPdf}>PDF 저장</button>
        <button className="btn-secondary" onClick={onJson}>JSON 백업</button>
        {hasSeries && <button className="btn-secondary" onClick={onSaveSession}>↻ 시리즈 저장</button>}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>

</body>
</html>
